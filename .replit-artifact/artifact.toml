kind = "web"
previewPath = "/bentopdf/"
title = "BentoPDF SmartNet"
description = "A self-hosted BentoPDF workspace prepared for SmartNet Cafe branding, including a matching header, footer, colors, and PDF tool navigation."
version = "1.0.0"
id = "artifacts/bentopdf-smartnet"
router = "path"

[[services]]
name = "web"
paths = [ "/bentopdf/" ]
localPort = 20894

[services.development]
run = "pnpm --filter @workspace/bentopdf-smartnet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bentopdf-smartnet", "run", "build" ]
serve = "static"
publicDir = "artifacts/bentopdf-smartnet/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20894"
BASE_PATH = "/bentopdf/"
