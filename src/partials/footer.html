{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="smartnet-footer border-t py-12">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-center md:text-left">
      <div class="mb-8 md:mb-0">
        <div class="flex items-center justify-center md:justify-start mb-4">
          <span class="smartnet-brand-mark smartnet-footer-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L12 2Z" fill="currentColor"/>
              <path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z" fill="currentColor"/>
            </svg>
          </span>
          <span id="footer-brand" class="smartnet-footer-brand">
            <strong>SmartNet Cafe</strong>
            <small>BUILT FOR BUSY COUNTERS</small>
          </span>
        </div>
        <p id="footer-copyright" class="text-gray-400 text-sm" {{#unless footerText}}data-i18n="footer.copyright"{{/unless}}>
          {{#if footerText}}{{footerText}}{{else}}&copy; 2026 SmartNet Cafe. All rights reserved.{{/if}}
        </p>
        <p class="text-gray-400 text-xs mt-2">
          <span data-i18n="footer.version">Version</span>
          <span id="app-version">{{appVersion}}</span>
        </p>
      </div>

      <div>
        <h3 class="font-bold text-white mb-4" data-i18n="footer.company">Company</h3>
        <ul class="space-y-2 text-gray-400">
          <li>
            <a href="https://smartnetcafe.com/about" class="hover:text-indigo-400" data-i18n="footer.aboutUs">About Us</a>
          </li>
          <li>
            <a href="https://smartnetcafe.com/contact" class="hover:text-indigo-400" data-i18n="footer.contactUs">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>
{{/if}}
